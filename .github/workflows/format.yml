name: Format

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply formatters
        run: npx prettier --write . && npx eslint . --fix || true
      - name: Commit formatted changes
        run: |
          git config user.name "renom-bot"
          git config user.email "chiraggamer7275@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: apply prettier+eslint --fix [skip ci]"
            git push origin dev
          fi
